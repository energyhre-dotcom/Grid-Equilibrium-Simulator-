<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid Frequency Equilibrium Simulator</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; background: #f8fafc; color: #1e293b; }
    .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin: 20px 0; }
    .control-group { display: flex; flex-direction: column; gap: 8px; }
    label { font-weight: 600; font-size: 14px; }
    input[type=range] { width: 100%; }
    button { background: #0284c7; color: white; border: none; padding: 10px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #0369a1; }
    .chart-container { position: relative; height: 350px; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>⚡ Grid Frequency Balance Simulator</h2>
    <p>Adjust supply and demand or trigger a generator failure to see real-time frequency stabilization.</p>
    
    <div class="controls">
      <div class="control-group">
        <label for="supply">Generation (MW): <span id="supplyVal">5000</span></label>
        <input type="range" id="supply" min="3000" max="7000" value="5000" step="50">
      </div>
      <div class="control-group">
        <label for="demand">Demand (MW): <span id="demandVal">5000</span></label>
        <input type="range" id="demand" min="3000" max="7000" value="5000" step="50">
      </div>
      <div class="control-group" style="justify-content: flex-end;">
        <button id="tripBtn">⚠️ Trip Generator (-500 MW)</button>
      </div>
    </div>

    <div class="chart-container">
      <canvas id="freqChart"></canvas>
    </div>
  </div>

  <script>
    const ctx = document.getElementById('freqChart').getContext('2d');
    let time = 0;
    const historyLength = 60;
    const labels = Array.from({length: historyLength}, (_, i) => `${i}s`);
    const data = Array(historyLength).fill(50.0);

    const chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: 'Grid Frequency (Hz)',
          data: data,
          borderColor: '#0284c7',
          backgroundColor: 'rgba(2, 132, 199, 0.1)',
          fill: true,
          tension: 0.3
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          y: { min: 48.5, max: 51.5, title: { display: true, text: 'Frequency (Hz)' } },
          x: { title: { display: true, text: 'Time Horizon' } }
        }
      }
    });

    let supply = 5000, demand = 5000, currentFreq = 50.0;
    const supplyInput = document.getElementById('supply');
    const demandInput = document.getElementById('demand');

    supplyInput.addEventListener('input', (e) => {
      supply = parseFloat(e.target.value);
      document.getElementById('supplyVal').innerText = supply;
    });

    demandInput.addEventListener('input', (e) => {
      demand = parseFloat(e.target.value);
      document.getElementById('demandVal').innerText = demand;
    });

    document.getElementById('tripBtn').addEventListener('click', () => {
      supply = Math.max(3000, supply - 500);
      supplyInput.value = supply;
      document.getElementById('supplyVal').innerText = supply;
    });

    setInterval(() => {
      const imbalance = supply - demand;
      // Physics calculation for frequency change based on governor and inertia response
      const targetFreq = 50.0 + (imbalance / 500); 
      currentFreq += (targetFreq - currentFreq) * 0.15;

      data.shift();
      data.push(currentFreq);
      chart.update('none');
    }, 500);
  </script>
</body>
</html>
